[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "app"
version = "0.1.0"
dependencies = [
    "anthropic>=1.3.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "httpx>=0.28.1",
    "litellm>=1.99.0",
    "locust>=2.46.4",
    "numpy>=2.5.2",
    "openai>=2.54.0",
    "presidio-analyzer>=2.2.362",
    "presidio-anonymizer>=2.2.364",
    "prometheus-client>=0.26.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "redis[hiredis]>=8.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.5",
    "slowapi>=0.1.10",
    "uvicorn>=0.52.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["."]
